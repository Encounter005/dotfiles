[mgr]
show_hidden = true
show_symlink = true
sort_by = "alphabetical"

[preview]
wrap = "yes"





[opener]
pdfreader = [
  {  run = "zathura %s", block = true  }
]

docx = [
    { run = "libreoffice %s", block = true }
]

edit = [
	{ run = "emacs %s", block = true},
]

play = [
	{ run = "mpv %s", orphan = true },
]

open = [
	{ run = "xdg-open %s", desc = "Open" },
]

image = [
  { run = 'imv %s', desc = "Image" }
]

extract = [
	{ run = "ouch -d -y %s", desc = "Extract here with ouch", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "video/*", use = "play" },
# 	# Multiple openers for a single rule
	{ url = "*.html", use = [ "browser", "text" ] },
  { url = "*.json", use = ["edit"]   },
  { url = "*.lua", use = ["edit"]   },
  { url = "*.db", use = ["edit"]   },
  { url = "*.c", use = ["edit"]   },
  { url = "*.png",  use = [ "image" ] },
  { url = "*.jpg",  use = [ "image" ] },
  { url = "*.webp", use = [ "image" ] },
  { url = "*.svg", use = [ "image" ] },
  { url = "*.ico", use = [ "image" ] },
  { url = "*.zip",  use = ["extract"] },
  { url = "*.tar",  use = ["extract"]  },
  { url = "*.rar",  use = ["extract"]  },
  { url = "*.7z",   use = ["extract"]  },
  { url = "*.xz",   use = ["extract"]  },
  { url = "*.pdf",   use = ["pdfreader"]  },
  { url = "*.py",      use = ["edit"] },
  { url = "*.docx", use = ["docx"] }
]

append_rules = [
  { url = "*",      use = ["open"] },
]


[plugin]
prepend_previewers = [
  # mardown previewer
  { url = "*.md", run = "rich-preview" },
  { url = "*.csv", run = "rich-preview" },
  { url = "*.rst", run = "rich-preview" },
  { url = "*.ipynb", run = "rich-preview" },
  { url = "*.json", run = "rich-preview" },
  # epub previewer
  { url = "*.epub", run = "epub" },
	# archive previewer
  { mime = "{image,audio,video}/*",       run = "mediainfo"},
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch"},
]
