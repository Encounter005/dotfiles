[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = [ "<Right>" ]
run = "plugin smart-enter"
desc = "Enter the subfolder faster, or open the file directly"

[[mgr.prepend_keymap]]
on   = [ "i" ]
run = "plugin easyjump"
desc = "easyjump"

[[mgr.prepend_keymap]]
on   = "<C-d>"
run  = "plugin diff"
desc = "Diff the selected with the hovered file"


[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on = ["t", "u"]
run = "tab_create --current"
desc = "Create a new tab using the current path"

[[mgr.prepend_keymap]]
on = ["t", "n"]
run = "tab_switch -1 --relative"
desc = "Switch to the previous tab"

[[mgr.prepend_keymap]]
on = ["t", "i"]
run = "tab_switch 1 --relative"
desc = "Switch to the next tab"

[[mgr.prepend_keymap]]
on = ["t", "q"]
run = "close"
desc = "Close the current tab, or quit if it is last tab"

[[mgr.prepend_keymap]]
on  = "<C-x>"
run = 'shell -- dragon-drop -x -i -T "$1"'
desc = "Drag and drop via"

[[mgr.prepend_keymap]]
on  = "y"
run = [ 'shell -- for path in "$@"; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ]
desc = "Copy selected files to system clipboard"

[[mgr.prepend_keymap]]
on  = [ "g", "c" ]
run = "plugin git-files"
desc = "Show Git file changes"

[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on   = "R"
run  = "plugin omni-trash"
desc = "Open Omni Trash"

